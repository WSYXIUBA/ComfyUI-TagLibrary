name: gates

# 只跑离线门禁 (不依赖运行中的 ComfyUI)。
# 在线门禁 (real_http / node_output / ui_v13 / ui_theme / ui_dialog_close / feature_e2e)
# 需要真机 ComfyUI 实例 + huashu-chrome 桥, 本地用:
#   python tools/run_gates.py --with-online

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  offline-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 插件本身无 pip 依赖; aiohttp 由 ComfyUI 运行时提供, 这里显式装上以便
      # 导入 api 包 (smoke_test 会走到路由层)。
      - name: Install runtime deps
        run: python -m pip install --upgrade pip aiohttp

      - name: Show available gates
        run: python tools/run_gates.py --list

      - name: Run offline gates
        run: python tools/run_gates.py
